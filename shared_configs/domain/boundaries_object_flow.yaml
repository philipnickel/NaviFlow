    pressure: {bc: neumann, gradient: 0.0}
    pressure:
      bc: neumann
      gradient: 0.0

  right:                     # outlet
    velocity:
      bc: oulet
      value: [0.0, 0.0]
    pressure:
      bc: neumann
      gradient: 0.0

