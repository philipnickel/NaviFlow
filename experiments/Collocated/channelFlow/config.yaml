name: channelFlow
description: Unstructured medium mesh simulation for Channel flow at Re=10
tags:
- channelFlow
- unstructured
- medium
- Re10
experiment: channelFlow
domain:
  mesh:
  - unstructured
  - medium
  boundary_conditions: shared_configs/domain/boundaries_channelFlow.yaml
physical_properties:
  rho: 1.0
  reynolds_number: 10
  characteristic_length: 1.0
  characteristic_velocity: 1.0
algorithm:
  type: SIMPLE
  relaxation_factors:
    velocity: 0.6
    pressure: 0.2
  max_iterations: 20000
  convergence_criteria:
    residual: 1e-7
  convection_discretization: TVD
  limiter: MUSCL
  non_orthogonal_corrections: 1
linear_solvers:
  momentum:
    type: bcgs
    preconditioner: hypre
    tolerance: 1e-10
    max_iterations: 100000
  pressure:
    type: bcgs
    preconditioner: hypre
    tolerance: 1e-12
    max_iterations: 100000
numba_cores: 6
