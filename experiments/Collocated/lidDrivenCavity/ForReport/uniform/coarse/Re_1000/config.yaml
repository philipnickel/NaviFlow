name: "lidDrivenCavity"
description: "Uniform coarse mesh simulation for Lid driven cavity at Re=1000" 
tags: ["lidDrivenCavity", "uniform", "coarse", "Re1000"]
experiment: "lidDrivenCavity"

domain:
  mesh: [uniform, coarse]  # 63x63 uniform mesh
  boundary_conditions: "shared_configs/domain/boundaries_lidDrivenCavity.yaml"

physical_properties:
  rho: 1.0         # Density
  reynolds_number: 1000
  characteristic_length: 1.0
  characteristic_velocity: 1.0

algorithm:
  type: "SIMPLE"
  relaxation_factors:
    velocity: 0.6
    pressure: 0.3
  max_iterations: 10000
  convergence_criteria:
    residual: 1e-4
  convection_discretization: "TVD" 
  limiter: "MUSCL"
  non_orthogonal_corrections: 2

linear_solvers:
  momentum:
    type: "bcgs"  
    preconditioner: "hypre"
    tolerance: 1e-7
    max_iterations: 100000
  pressure:
    type: "bcgs"  
    preconditioner: "hypre"
    tolerance: 1e-10
    max_iterations: 100000

numba_cores: 6 