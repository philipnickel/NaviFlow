algorithm:
  convection_discretization: TVD
  convergence_criteria:
    residual: 1e-6
  limiter: MUSCL
  max_iterations: 35000
  non_orthogonal_corrections: 2
  relaxation_factors:
    pressure: 0.2
    velocity: 0.5
  type: SIMPLE
  transient: true
  dt: 0.25
  end_time: 30.0
  save_interval: 100
  time_scheme: "CrankNicolson"
description: TVD uniform medium mesh simulation for Lid driven cavity at Re=100
domain:
  boundary_conditions: shared_configs/domain/boundaries_lidDrivenCavity.yaml
  mesh:
  - uniform
  - medium
experiment: lidDrivenCavity
linear_solvers:
  momentum:
    max_iterations: 100000
    preconditioner: hypre
    tolerance: 1e-10
    type: bcgs
  pressure:
    max_iterations: 100000
    preconditioner: hypre
    tolerance: 1e-12
    type: bcgs
name: lidDrivenCavity
numba_cores: 6
physical_properties:
  characteristic_length: 1.0
  characteristic_velocity: 1.0
  reynolds_number: 400
  rho: 1.0
tags:
- lidDrivenCavity
- TVD
- uniform
- medium
- Re100
