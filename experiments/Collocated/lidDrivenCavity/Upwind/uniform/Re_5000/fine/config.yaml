algorithm:
  convection_discretization: Upwind
  convergence_criteria:
    residual: 1.0e-09
  limiter: null
  max_iterations: 20000
  non_orthogonal_corrections: 2
  relaxation_factors:
    pressure: 0.1
    velocity: 0.3
  type: SIMPLE
description: Upwind uniform fine mesh simulation for Lid driven cavity at Re=5000
domain:
  boundary_conditions: shared_configs/domain/boundaries_lidDrivenCavity.yaml
  mesh:
  - uniform
  - fine
experiment: lidDrivenCavity
linear_solvers:
  momentum:
    max_iterations: 100000
    preconditioner: hypre
    tolerance: 1.0e-12
    type: bcgs
  pressure:
    max_iterations: 100000
    preconditioner: hypre
    tolerance: 1.0e-14
    type: bcgs
name: lidDrivenCavity
numba_cores: 6
physical_properties:
  characteristic_length: 1.0
  characteristic_velocity: 1.0
  reynolds_number: 5000
  rho: 1.0
tags:
- lidDrivenCavity
- Upwind
- uniform
- fine
- Re5000
