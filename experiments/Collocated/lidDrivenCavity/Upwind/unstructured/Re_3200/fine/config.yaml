algorithm:
  convection_discretization: Upwind
  convergence_criteria:
    residual: 1e-7
  limiter: null
  max_iterations: 10000
  non_orthogonal_corrections: 2
  relaxation_factors:
    pressure: 0.2
    velocity: 0.5
  type: SIMPLE
description: Upwind unstructured fine mesh simulation for Lid driven cavity at Re=3200
domain:
  boundary_conditions: shared_configs/domain/boundaries_lidDrivenCavity.yaml
  mesh:
  - unstructured
  - fine
experiment: lidDrivenCavity
linear_solvers:
  momentum:
    max_iterations: 100000
    preconditioner: hypre
    tolerance: 1e-8
    type: bcgs
  pressure:
    max_iterations: 100000
    preconditioner: hypre
    tolerance: 1e-10
    type: bcgs
name: lidDrivenCavity
numba_cores: 6
physical_properties:
  characteristic_length: 1.0
  characteristic_velocity: 1.0
  reynolds_number: 3200
  rho: 1.0
tags:
- lidDrivenCavity
- Upwind
- unstructured
- fine
- Re3200
