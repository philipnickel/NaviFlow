name: "lidDrivenCavity"
description: "Unstructured fine mesh simulation for Lid driven cavity at Re=100" 
tags: ["lidDrivenCavity", "unstructured", "fine", "Re100"]
experiment: "lidDrivenCavity"

domain:
  mesh: [unstructured, fine]  # 56000 cells with boundary refinement
  boundary_conditions: "shared_configs/domain/boundaries_lidDrivenCavity.yaml"

physical_properties:
  rho: 1.0         # Density
  reynolds_number: 100
  characteristic_length: 1.0
  characteristic_velocity: 1.0

algorithm:
  type: "SIMPLE"
  relaxation_factors:
    velocity: 0.6
    pressure: 0.3
  max_iterations: 200
  convergence_criteria:
    residual: 1e-4
  convection_discretization: "Upwind" 
  limiter: None
  non_orthogonal_corrections: 2

linear_solvers:
  momentum:
    type: "bcgs"  
    preconditioner: "hypre"
    tolerance: 1e-7
    max_iterations: 100000
  pressure:
    type: "bcgs"  
    preconditioner: "hypre"
    tolerance: 1e-10
    max_iterations: 100000

numba_cores: 6 