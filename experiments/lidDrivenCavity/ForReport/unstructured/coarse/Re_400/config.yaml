name: "lidDrivenCavity"
description: "Unstructured coarse mesh simulation for Lid driven cavity at Re=400" 
tags: ["lidDrivenCavity", "unstructured", "coarse", "Re400"]
experiment: "lidDrivenCavity"

domain:
  mesh: [unstructured, coarse]  # 3500 cells with boundary refinement
  boundary_conditions: "shared_configs/domain/boundaries_lidDrivenCavity.yaml"

physical_properties:
  rho: 1.0         # Density
  reynolds_number: 400
  characteristic_length: 1.0
  characteristic_velocity: 1.0

algorithm:
  type: "SIMPLE"
  relaxation_factors:
    velocity: 0.5
    pressure: 0.2
  max_iterations: 10000
  convergence_criteria:
    residual: 1e-4
  convection_discretization: "Upwind" 
  limiter: None 
  non_orthogonal_corrections: 2

linear_solvers:
  momentum:
    type: "bcgs"  
    preconditioner: "hypre"
    tolerance: 1e-7
    max_iterations: 100000
  pressure:
    type: "bcgs"  
    preconditioner: "hypre"
    tolerance: 1e-10
    max_iterations: 100000

numba_cores: 6 