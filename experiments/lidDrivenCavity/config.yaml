name: "lidDrivenCavity"
description: "Defaults simulation config for Lid driven cavity" 
tags: ["lidDrivenCavity"]

domain:
  # Using the coarse structured mesh 
  mesh: [uniform, coarse] # or uniform
  boundary_conditions: "shared_configs/domain/boundaries_lidDrivenCavity.yaml"


physical_properties:
  rho: 1.0         # Density
  reynolds_number: 100 # may be overwritten by command line arguments
  characteristic_length: 1.0
  characteristic_velocity: 1.0

# Solver algorithm configuration
algorithm:
  type: "SIMPLE" # piso converges in: 800 iterations
  #PISO_corrections: 5
  relaxation_factors:
    velocity: 0.6 # may be overwritten by command line arguments
    pressure: 0.4 # may be overwritten by command line arguments
  max_iterations: 10000 # may be overwritten by command line arguments
  convergence_criteria:
    residual: 1e-4
  convection_discretization: "Upwind" 
  limiter: None

# Linear solver settings (from PETSc)
linear_solvers:
  momentum:
    type: "bcgs"  
    preconditioner: "hypre"
    tolerance: 1e-5
    max_iterations: 100000
  pressure:
    type: "bcgs"  
    preconditioner: "hypre"
    tolerance: 1e-8
    max_iterations: 100000

# HPC stuff
numba_cores: default # may be overwritten by command line arguments