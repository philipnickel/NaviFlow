name: "lidDrivenCavity_performance_test"
description: "Performance test for matrix assembly optimization - fine mesh, few iterations" 
tags: ["lidDrivenCavity", "unstructured", "fine", "performance"]
experiment: "lidDrivenCavity"

domain:
  mesh: [unstructured, fine]  # 56000 cells with boundary refinement
  boundary_conditions: "shared_configs/domain/boundaries_lidDrivenCavity.yaml"

physical_properties:
  rho: 1.0         # Density
  reynolds_number: 100
  characteristic_length: 1.0
  characteristic_velocity: 1.0

algorithm:
  type: "SIMPLE"
  relaxation_factors:
    velocity: 0.6
    pressure: 0.3
  max_iterations: 5  # Just 5 iterations for performance testing
  convergence_criteria:
    residual: 1e-4
  convection_discretization: "Upwind" 
  limiter: None
  non_orthogonal_corrections: 2

linear_solvers:
  momentum:
    type: "bcgs"  
    preconditioner: "hypre"
    tolerance: 1e-7
    max_iterations: 1000  # Reduced for faster testing
  pressure:
    type: "bcgs"  
    preconditioner: "hypre"
    tolerance: 1e-10
    max_iterations: 1000  # Reduced for faster testing

numba_cores: 6 