name: "channelFlow"
description: "Hagen-Poiseuille flow validation case"
tags: ["channelFlow", "validation"]
experiment: "channelFlow"

domain:
  # Using the fine structured mesh 
  mesh: [unstructured, coarse]
  boundary_conditions: "shared_configs/domain/boundaries_channelFlow.yaml"

physical_properties:
  rho: 1.0         # Density
  characteristic_length: 1.0  # Channel height
  characteristic_velocity: 1.0  
  reynolds_number: 10  # Low Re for laminar flow

# Solver algorithm configuration
algorithm:
  type: "SIMPLE"
  #piso_iterations: 2
  relaxation_factors:
    velocity: 0.7  # Increased for better convergence
    pressure: 0.3
  max_iterations: 5000
  convergence_criteria:
    residual: 1e-6  # Stricter convergence criteria
  convection_discretization: "Upwind" 
  limiter: None 
  non_orthogonal_corrections: 3  # Number of non-orthogonal corrections for pressure

# Linear solver settings (from PETSc)
linear_solvers:
  momentum:
    type: "bcgs"  
    preconditioner: "gamg"
    tolerance: 1e-7
    max_iterations: 100000
  pressure:
    type: "cg"  
    preconditioner: "hypre"
    tolerance: 1e-8
    max_iterations: 100000

# HPC stuff
numba_cores: default # may be overwritten by command line arguments 